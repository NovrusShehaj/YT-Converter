name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.build-type }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build-type: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            pkg-config \
            libboost-all-dev \
            libssl-dev \
            libcpprest-dev \
            ffmpeg \
            python3-pip
          pip3 install --user yt-dlp

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake boost cpprestsdk openssl ffmpeg yt-dlp

      - name: Setup build cache (Ubuntu)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.build-type }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.build-type }}-
            ${{ runner.os }}-

      - name: Setup build cache (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/ccache
            ~/Library/Caches/pip
          key: ${{ runner.os }}-${{ matrix.build-type }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.build-type }}-
            ${{ runner.os }}-

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DBUILD_TESTS=ON \
            -DBUILD_API=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Forbid shell process APIs
        run: bash tests/check_no_system.sh

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload binaries and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.build-type }}
          path: |
            build/yt2mp3-cli
            build/yt2mp3-api
            build/yt-converter-tests
            build/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14

  build-status:
    name: Build Status Check
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "All builds completed successfully"
            exit 0
          fi
          echo "Build failed on one or more platforms"
          exit 1
