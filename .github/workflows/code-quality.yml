name: Code Quality

on:
  push:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.clang-format'
      - '.github/workflows/code-quality.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.clang-format'
      - '.github/workflows/code-quality.yml'

jobs:
  clang-format:
    name: Code Formatting (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Check code formatting
        run: |
          files=$(find src include tests -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \))
          format_issues=0
          for file in $files; do
            if ! clang-format --dry-run -Werror "$file" >/dev/null 2>&1; then
              echo "Formatting issue in: $file"
              clang-format --dry-run "$file"
              format_issues=$((format_issues + 1))
            fi
          done
          if [ "$format_issues" -gt 0 ]; then
            echo "Found $format_issues file(s) with formatting issues"
            exit 1
          fi

  no-shell-spawn:
    name: Forbid system() in src
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for system and popen
        run: bash tests/check_no_system.sh

  clang-tidy:
    name: Static Analysis (clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang-tidy clang \
            libboost-all-dev libssl-dev libcpprest-dev pkg-config
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTS=OFF
      - name: Run clang-tidy
        run: |
          files=$(find src include -type f \( -name '*.cpp' -o -name '*.h' \))
          clang-tidy $files -p build -- || true

  compiler-warnings:
    name: Compiler Warnings Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential \
            libboost-all-dev libssl-dev libcpprest-dev pkg-config
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic"
          cmake --build build --parallel

  complexity-check:
    name: Code Complexity Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction \
            --inconclusive --std=c++17 --error-exitcode=0 -i build -i .git .

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y flawfinder
      - name: Run flawfinder
        run: flawfinder src include --minlevel=3 --quiet || true
      - name: Forbid shell spawn
        run: bash tests/check_no_system.sh

  quality-summary:
    name: Quality Check Summary
    runs-on: ubuntu-latest
    needs: [clang-format, no-shell-spawn, clang-tidy, compiler-warnings, complexity-check, security-scan]
    if: always()
    steps:
      - name: Require hard gates
        run: |
          if [ "${{ needs.clang-format.result }}" != "success" ]; then
            echo "clang-format failed"
            exit 1
          fi
          if [ "${{ needs.no-shell-spawn.result }}" != "success" ]; then
            echo "system() grep failed"
            exit 1
          fi
          if [ "${{ needs.security-scan.result }}" != "success" ]; then
            echo "security scan failed"
            exit 1
          fi
          echo "Required quality gates passed"
