name: Code Quality

# No path filters: these are required checks and must report on every change.
on:
  push:
  pull_request:

env:
  # Pinned so local runs (`uvx --from clang-format==18.1.8 clang-format`) and CI agree byte for byte.
  CLANG_FORMAT_VERSION: "18.1.8"

jobs:
  clang-format:
    name: Code Formatting (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pipx install "clang-format==${CLANG_FORMAT_VERSION}"
      - name: Validate formatter configuration
        run: clang-format --dump-config > /dev/null
      - name: Check code formatting
        run: |
          set -euo pipefail
          files=$(git ls-files '*.cpp' '*.h' '*.hpp')
          clang-format --dry-run -Werror $files

  no-shell-spawn:
    name: Forbid system() in src
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for system and popen
        run: bash tests/check_no_system.sh

  clang-tidy:
    name: Static Analysis (clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential pkg-config \
            libboost-all-dev libssl-dev libcpprest-dev clang-tidy
          clang-tidy --version
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_API=ON -DBUILD_TESTS=OFF
      - name: Run clang-tidy
        # .clang-tidy sets WarningsAsErrors, so any finding fails this required gate.
        run: clang-tidy -p build --quiet $(git ls-files 'src/*.cpp')

  compiler-warnings:
    name: Compiler Warnings (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential clang pkg-config \
            libboost-all-dev libssl-dev libcpprest-dev
      - name: Configure and build with -Werror
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DBUILD_API=ON -DBUILD_TESTS=ON -DYTCONV_WERROR=ON
          cmake --build build --parallel

  # Advisory jobs report findings but are not merge evidence; they are excluded from the summary.
  cppcheck-advisory:
    name: cppcheck (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,performance,portability --suppress=missingIncludeSystem \
            --inconclusive --std=c++17 --error-exitcode=1 -I include src

  flawfinder-advisory:
    name: flawfinder (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y flawfinder
      - name: Run flawfinder
        run: flawfinder --minlevel=3 --error-level=4 src include

  quality-summary:
    name: Quality Check Summary
    runs-on: ubuntu-latest
    needs: [clang-format, no-shell-spawn, clang-tidy, compiler-warnings]
    if: always()
    steps:
      - name: Require hard gates
        run: |
          for result in "${{ needs.clang-format.result }}" "${{ needs.no-shell-spawn.result }}" \
                        "${{ needs.clang-tidy.result }}" "${{ needs.compiler-warnings.result }}"; do
            if [ "$result" != "success" ]; then
              echo "A required quality gate did not succeed: $result"
              exit 1
            fi
          done
          echo "Required quality gates passed"
